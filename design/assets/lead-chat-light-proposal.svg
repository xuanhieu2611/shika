<title id="title">Lead chat proposal - Shika Light</title>
<desc id="desc">Static conversation pane design. Header with initial avatar and Lead name. Two author messages on the right, each followed by only its final Lead response on the left. Centered timestamps and a worker event, then a pill composer. Geometry approved by the author. Colors are static snapshots of existing default-theme chrome, not runtime constants. Sample content only.</desc>
