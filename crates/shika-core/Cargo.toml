[package]
name = "shika-core"
version = "0.1.0"
description = "Shika's backend: projects, worktrees, CLI presets, PTY processes, and sessions"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# Same crate and major version Tauri 2 used for `app_data_dir`, so the data
# directory resolves exactly as it did before the port.
dirs = "7"
# Cursor CLI names its chat folders after the md5 of the working directory.
md-5 = "0.10"
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
