[package]
name = "shika"
version = "0.2.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
gpui = { workspace = true }
gpui_platform = { workspace = true }
shika-core = { path = "../shika-core" }
shika-terminal = { path = "../shika-terminal" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-user-notifications = "0.3.2"
block2 = "0.6.2"
# Same major version GPUI implements, to reach the NSWindow for the blur radius.
raw-window-handle = "0.6"
