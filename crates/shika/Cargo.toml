[package]
name = "shika"
version = "0.11.4"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
libc = "0.2"
serde_json = "1"
gpui = { workspace = true }
gpui_platform = { workspace = true }
shika-core = { path = "../shika-core" }
shika-terminal = { path = "../shika-terminal" }
# Display width for cutting diff lines to the columns on screen. The same
# version alacritty_terminal uses.
unicode-width = "0.2.2"
# Native task-name editing moves and deletes whole graphemes.
unicode-segmentation = "1.13.3"
# Decodes the background image and builds its effects. The same version and
# a subset of the formats GPUI already enables, so it adds no crate.
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-user-notifications = "0.3.2"
block2 = "0.6.2"
# Same major version GPUI implements, to reach the NSWindow for the blur radius.
raw-window-handle = "0.6"

# Test windows for the chat's scrolling. Dev only: neither the app nor its
# license notices (`ignore-dev-dependencies`) include it.
[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
