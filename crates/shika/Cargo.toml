[package]
name = "shika"
version = "0.5.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
serde_json = "1"
gpui = { workspace = true }
gpui_platform = { workspace = true }
shika-core = { path = "../shika-core" }
shika-terminal = { path = "../shika-terminal" }
# Display width for cutting diff lines to the columns on screen. The same
# version alacritty_terminal uses.
unicode-width = "0.2.2"
# Native task-name editing moves and deletes whole graphemes.
unicode-segmentation = "1.13.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-user-notifications = "0.3.2"
block2 = "0.6.2"
# Same major version GPUI implements, to reach the NSWindow for the blur radius.
raw-window-handle = "0.6"
