[workspace]
resolver = "3"
members = ["crates/*"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# GPUI comes from Zed's git tree, not crates.io (0.2.2 there is stale).
# Pinned to the v1.25.3 stable tag (2026-10-23): a stable release has been
# shipped to Zed users, so the gpui and gpui_platform at that commit are known
# to build and run on macOS together.
# None of Zed's own [patch.crates-io] entries are needed to build gpui and
# gpui_platform on macOS from this commit: they cover tree-sitter, livekit,
# Windows capture, and Linux calloop, which these two crates do not pull in
# here. async-task resolves from crates.io and builds as is.
# Upstream includes https://github.com/zed-industries/zed/pull/65571, so
# translucent fills composite with source-over alpha and washes in glass
# let the desktop show through. Shika no longer needs its glass-blend fork.
# Keep the old fork branches: past Shika commits still pin their revisions.
# To move to a newer Zed stable tag, pin both entries to that tag's commit,
# run cargo update -w and the workspace tests, regenerate dependency notices,
# and check glass washes (the selected card over a bright wallpaper) in a
# built app. Keep both GPUI dependencies on the same revision.
[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "8dd255c3eafb5231056fe4e6f601cedd011f1c93" }
# Compile Metal shaders when the app starts, so builds need full Xcode but
# do not also require the separate Metal Toolchain component. Keep this
# feature for local and release builds unless the toolchain is changed
# deliberately and both build and startup are verified.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "8dd255c3eafb5231056fe4e6f601cedd011f1c93", features = ["font-kit", "runtime_shaders"] }
