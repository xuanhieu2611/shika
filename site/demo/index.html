<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shika prototype</title>
<meta name="description" content="An interactive prototype of Shika with sample data. No agent or Git command runs in the browser.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../img/favicon-32.png">
<link rel="preload" href="../fonts/JetBrainsMono-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="demo.css">
<style>
  /* Standalone, the window sits on the forest painting as a desktop. The
     landing page embeds it with ?embed=1, without a desktop. */
  html:not(.is-embedded) body { display: grid; place-items: center; background: #3d4a33 url("../img/forest-center.webp") center / cover no-repeat; }
  html:not(.is-embedded) #app { flex: none; transform-origin: center; box-shadow: 0 30px 80px rgba(10, 16, 8, 0.45), 0 10px 30px rgba(10, 16, 8, 0.3); }
</style>
</head>
<body>
<div id="app" class="win" role="application" aria-label="Shika prototype with sample data. Use j and k to move between agents, Enter to focus the terminal, Control Q to return to the cards, and Command N for a new agent."></div>
<script src="demo.js"></script>
</body>
</html>
